name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # 必须具备写入权限以发布 Release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Installing gradle to generate wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/DeepCommunity-debug.apk \;

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepCommunity-Android-APK
          path: output_apk/DeepCommunity-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Deepcommunity-APP v1.0.0"
          files: output_apk/DeepCommunity-debug.apk
          body: |
            ### 深度社区 (Deep Community) 原生 Android 客户端
            - 极客黑白极简 & 液态毛玻璃设计规范
            - 动态广场、社群实时通讯、原生长图海报生成与分享
            - 沉浸式多点触控图片浏览器、发帖 Markdown 实时预览
            - 桌面灵动微件、一键打卡签到

            **下载说明**：
            直接点击下方 Assets 中的 `DeepCommunity-debug.apk` 即可下载安装到安卓设备体验。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

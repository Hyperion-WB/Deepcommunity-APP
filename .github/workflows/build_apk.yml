name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/DeepCommunity-debug.apk \;

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepCommunity-Android-APK
          path: output_apk/DeepCommunity-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Deepcommunity-APP ${{ github.ref_name }}"
          files: output_apk/DeepCommunity-debug.apk
          body: |
            ### 深度社区 (Deep Community) 原生 Android 客户端 ${{ github.ref_name }}
            
            #### 🌟 核心新特性与全站交互升级 (v1.0.1)
            - **“关注”专属动态流 (Following Feed)**：首页顶部支持“推荐 / 关注”双流随心切换，紧跟好友最新动态；
            - **他人个人主页弹窗 (User Profile)**：点击文章作者、评论者、群成员头像可唤起半屏主页，支持关注/取关、私信与主页举报；
            - **关注与粉丝列表 (Followers & Following)**：个人主页点击关注或粉丝计数唤起抽屉，清晰展示互相关注状态与等级勋章；
            - **全场景举报违规通道 (Report)**：支持帖子与评论举报，细分垃圾广告、人身攻击、不良内容等合规分类；
            - **问答采纳与作者置顶 (Accept & Feature)**：文章作者可将优质回答设为“👑 最佳采纳”或“📌 精选置顶”，高亮徽章优先展示；
            - **表情包管理中心 (Stickers Management)**：支持在“我的表情”长按确认移除，保持自选表情库整洁；
            - **入群审批中心 (Requests Management)**：群主/管理员可实时审批待入群申请，支持一键批准与拒绝；
            - **隐私与夜间免打扰 (Privacy & DND)**：支持陌生人私信限制、在线状态隐藏与定时夜间免打扰时段；
            - **全站活跃榜与绿格子热力图 (Leaderboards & Heatmap)**：规划轻量胶囊入口，帖子为重抽屉展开，展示连续签到榜、抢早榜、7日活跃榜与打卡进度；
            - **图文混排与消息流修复**：群聊带图消息与引用带图消息渲染彻底修复，消除裸露图片路径，支持骰子与签到卡片；
            - **多端同步优化**：点击主页与顶部标题平滑回到顶部并刷新最新数据，确保与Web端实时一致；
            - **黑白极简与毛玻璃视觉升级**：消除方块水波纹，全面引入触觉微震动与液态毛玻璃卡片质感。

            **下载说明**：
            直接点击下方 Assets 中的 `DeepCommunity-debug.apk` 即可下载安装到安卓设备体验。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
